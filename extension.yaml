id: jcode.lang.cpp
name: C/C++ Dev Pack
publisher: jcode
version: 0.1.4
type: language
# clangd (the LSP) installs as a requirement, so the pack works out of the box; the clangd toolchain SDK
# is suggested (the LSP already provides the clangd binary) and lldb-dap stays suggested — debugging is
# an opt-in, larger setup.
requires:
  lsps: [clangd]
suggests:
  sdks: [clangd]
  dbg: [lldb-dap]
description: Coloring, completions, snippets, and a clang-format formatter for C and C++.

# One extension, two languages. Each entry is a self-contained language pack
# (coloring + completions + helpers + formatter) by file extension.
languages:
  - c
  - cpp
# --- header fields merged from extension.jehm ---
shortDescription: Coloring, completions, snippets, and a clang-format formatter for C and C++.
minJCodeVersion: 1.0.0
targetJCodeVersion: 1.3.5
category: Languages
subcategory: C/C++
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
entry:
  manifest: extension.yaml
  ui: null
  libs: []
